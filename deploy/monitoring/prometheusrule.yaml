apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: self-healing-alerts
  namespace: self-healing
  labels: {release: kube-prometheus-stack}   # must match your Prometheus ruleSelector
spec:
  groups:
    - name: pod-healing
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="self-healing"}[15m]) > 3
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} restarted {{ $value }} times in 15m."
        - alert: PodNotReady
          expr: sum by (namespace, pod) (kube_pod_status_ready{condition="false", namespace="self-healing"}) > 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not Ready for 5m"
        - alert: DeploymentReplicasMismatch
          expr: kube_deployment_status_replicas_available{namespace="self-healing"} < kube_deployment_spec_replicas{namespace="self-healing"}
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Deployment {{ $labels.deployment }} has fewer available replicas than desired"
        - alert: PDBNoDisruptionsAllowed
          expr: kube_poddisruptionbudget_status_pod_disruptions_allowed{namespace="self-healing"} == 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "PDB {{ $labels.poddisruptionbudget }} allows 0 disruptions; node drains will be blocked"
        - alert: HPAMaxedOut
          expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="self-healing"} == kube_horizontalpodautoscaler_spec_max_replicas{namespace="self-healing"}
          for: 15m
          labels: {severity: info}
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} is at max replicas"
    - name: node-healing
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 3m
          labels: {severity: critical}
          annotations:
            summary: "Node {{ $labels.node }} NotReady for 3m"
            description: "node-healer acts after NOT_READY_THRESHOLD_SECONDS (default 300s)."
        - alert: NodeProblemDetected
          expr: problem_gauge{type=~"KernelDeadlock|ReadonlyFilesystem"} == 1
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "node-problem-detector reports {{ $labels.type }} on {{ $labels.instance }}"
        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Node {{ $labels.node }} under memory pressure"
        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Node {{ $labels.node }} under disk pressure"
        - alert: NodeUnschedulableTooLong
          expr: kube_node_spec_unschedulable == 1
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "Node {{ $labels.node }} cordoned for >30m (was it drained and forgotten?)"
        - alert: NodeHealerRefusing
          expr: increase(node_healer_actions_total{result="refused-too-many"}[10m]) > 0
          labels: {severity: critical}
          annotations:
            summary: "node-healer refused to act: too many nodes unhealthy - investigate manually"
        - alert: NodeHealerDrainTimeout
          expr: increase(node_healer_actions_total{action="drain", result="timeout"}[30m]) > 0
          labels: {severity: warning}
          annotations:
            summary: "node-healer could not drain a node (PDB blocking?)"
