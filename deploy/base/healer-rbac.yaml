apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-healer
  namespace: self-healing
---
# Least privilege: read nodes/pods, cordon (patch nodes), evict pods, emit events.
# Deleting nodes is a separate ClusterRole that is only bound in the EKS overlay.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-healer
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-healer
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: node-healer}
subjects:
  - {kind: ServiceAccount, name: node-healer, namespace: self-healing}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-healer-replace
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [delete]
