apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-problem-detector
  namespace: self-healing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-problem-detector
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes/status]
    verbs: [patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-problem-detector
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: node-problem-detector}
subjects:
  - {kind: ServiceAccount, name: node-problem-detector, namespace: self-healing}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-problem-detector
  namespace: self-healing
  labels: {app.kubernetes.io/name: node-problem-detector}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: node-problem-detector}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: node-problem-detector}
    spec:
      serviceAccountName: node-problem-detector
      priorityClassName: system-node-critical
      tolerations:
        - {operator: Exists, effect: NoSchedule}
        - {operator: Exists, effect: NoExecute}
      containers:
        - name: node-problem-detector
          image: registry.k8s.io/node-problem-detector/node-problem-detector:v0.8.19
          command:
            - /node-problem-detector
            - --logtostderr
            - --config.system-log-monitor=/config/kernel-monitor.json
            - --prometheus-address=0.0.0.0
            - --prometheus-port=20257
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
          ports:
            - {name: metrics, containerPort: 20257}
          securityContext:
            privileged: true   # needs read access to the host journal / kmsg
          resources:
            requests: {cpu: 10m, memory: 80Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: log, mountPath: /var/log, readOnly: true}
            - {name: localtime, mountPath: /etc/localtime, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - {name: log, hostPath: {path: /var/log}}
        - {name: localtime, hostPath: {path: /etc/localtime, type: FileOrCreate}}
        - name: config
          configMap:
            name: node-problem-detector-config
